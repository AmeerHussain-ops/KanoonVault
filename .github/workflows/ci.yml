name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux System Dependencies (CRITICAL FOR OCR)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Offline smoke (imports, DB, timeline regex)
        env:
          CI_OFFLINE: "1"
        run: python scripts/ci_smoke.py --offline

      - name: API key smoke (when secrets configured)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TIMELINE_API_KEY: ${{ secrets.TIMELINE_API_KEY }}
          OCR_VISION_API_KEY: ${{ secrets.OCR_VISION_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            python scripts/ci_smoke.py
          else
            echo "Skipping online smoke test because API secrets are not configured in GitHub repository settings."
          fi
