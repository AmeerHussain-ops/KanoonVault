<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to KanoonVault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
        }
        
        .welcome-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 36px;
            color: #1e3c72;
            margin-bottom: 16px;
        }
        
        .tagline {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
        }
        
        .features {
            text-align: left;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .feature:last-child {
            margin-bottom: 0;
        }
        
        .feature-icon {
            font-size: 24px;
            margin-right: 12px;
            margin-top: 2px;
        }
        
        .feature-text {
            color: #333;
        }
        
        button {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .btn-primary {
            background: #2a5298;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1e3c72;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 82, 152, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .divider {
            margin: 24px 0;
            color: #ddd;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-card">
            <div class="logo">⚖️</div>
            
            <h1>Welcome to KanoonVault</h1>
            
            <div class="tagline">
                Your private, local-first legal case vault.
            </div>
            
            <div class="subtitle">
                Your case data is stored on your computer.
            </div>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📄</div>
                    <div class="feature-text">Upload and OCR legal documents</div>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">⏰</div>
                    <div class="feature-text">Automatic case timeline extraction</div>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">🤖</div>
                    <div class="feature-text">AI-powered case chat grounded in your documents</div>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-text">No cloud storage—everything stays on your computer</div>
                </div>
            </div>
            
            <button class="btn-primary" onclick="getStarted()">
                Get Started
            </button>
        </div>
    </div>
    
    <script>
        function getStarted() {
            window.location.href = '/static/storage-selection.html';
        }
    </script>
</body>
</html>
