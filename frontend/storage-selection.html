<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Storage Location - KanoonVault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        .setup-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h2 {
            font-size: 24px;
            color: #1e3c72;
            margin-bottom: 12px;
        }
        
        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .path-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            word-break: break-all;
            line-height: 1.5;
        }
        
        .path-icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .path-text {
            flex: 1;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #2196f3;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .storage-info {
            background: #f5f5f5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .storage-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        
        .storage-info-row:last-child {
            margin-bottom: 0;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary {
            flex: 1;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }
        
        .btn-secondary:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            flex: 2;
            background: #2a5298;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1e3c72;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 16px;
            text-align: center;
        }
        
        .status-message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .status-message.show {
            display: block;
        }
        
        .status-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        
        .status-loading {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }
        
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(21, 101, 192, 0.2);
            border-top-color: #1565c0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="setup-card">
            <h2>Choose Storage Location</h2>
            
            <p class="description">
                Where should KanoonVault store your data? This includes your cases, uploaded documents, search index, and application settings.
            </p>
            
            <div class="form-group">
                <label>Storage Location</label>
                <div class="path-display">
                    <div class="path-icon">📁</div>
                    <div class="path-text" id="storagePath"></div>
                </div>
            </div>
            
            <div id="storageInfo" class="storage-info"></div>
            
            <div id="statusMessage" class="status-message"></div>
            
            <div class="info-box">
                You can change this later in Settings. Your existing documents will be preserved.
            </div>
            
            <div class="button-group">
                <button class="btn-secondary" id="changeBtn" onclick="changeLocation()">
                    📁 Change Location
                </button>
                <button class="btn-primary" id="continueBtn" onclick="continueWithLocation()">
                    Continue
                </button>
            </div>
            
            <p class="help-text">
                Default location: %APPDATA%\Local\KanoonVault
            </p>
        </div>
    </div>
    
    <script>
        let selectedStoragePath = null;
        
        async function initializeStorageSelection() {
            try {
                const response = await fetch('/api/setup/storage-location');
                const data = await response.json();
                
                selectedStoragePath = data.default_storage_dir;
                updateStorageDisplay();
            } catch (error) {
                console.error('Error loading storage configuration:', error);
                showStatus('Failed to load storage settings. Please refresh.', 'error');
            }
        }
        
        function updateStorageDisplay() {
            document.getElementById('storagePath').textContent = selectedStoragePath;
            updateStorageInfo();
        }
        
        async function updateStorageInfo() {
            try {
                const response = await fetch('/api/setup/storage-info?path=' + encodeURIComponent(selectedStoragePath));
                const data = response.json();
                
                const info = await data;
                const infoDiv = document.getElementById('storageInfo');
                
                let html = '<strong>Storage Information:</strong><br>';
                html += `<div class="storage-info-row">
                    <span>Available space:</span>
                    <span>${info.disk_space.free_gb || '?'} GB free</span>
                </div>`;
                
                if (info.existing_data) {
                    html += `<div class="storage-info-row">
                        <span>Existing data:</span>
                        <span>${info.existing_data.size_mb || 0} MB (${info.existing_data.file_count || 0} files)</span>
                    </div>`;
                }
                
                infoDiv.innerHTML = html;
            } catch (error) {
                console.error('Error updating storage info:', error);
            }
        }
        
        async function changeLocation() {
            const changeBtn = document.getElementById('changeBtn');
            changeBtn.disabled = true;
            showStatus('<span class="spinner"></span>Opening folder selection...', 'loading');
            
            try {
                const response = await fetch('/api/setup/browse-storage-location', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.selected_path) {
                    selectedStoragePath = data.selected_path;
                    updateStorageDisplay();
                    showStatus('');
                    
                    // Show confirmation dialog
                    if (confirm(`Store data at:\n\n${selectedStoragePath}\n\nThis folder will contain your KanoonVault database, documents, and search data.`)) {
                        // Confirmed, path is already set
                        showStatus('');
                    } else {
                        // User cancelled confirmation
                        await initializeStorageSelection(); // Reset to default
                    }
                } else if (data.cancelled) {
                    showStatus('');
                } else {
                    showStatus(data.error || 'Failed to select folder', 'error');
                    await initializeStorageSelection(); // Reset to default
                }
            } catch (error) {
                console.error('Error changing location:', error);
                showStatus('Failed to open folder selection: ' + error.message, 'error');
            } finally {
                changeBtn.disabled = false;
            }
        }
        
        async function continueWithLocation() {
            if (!selectedStoragePath) {
                showStatus('Please select a storage location', 'error');
                return;
            }
            
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.disabled = true;
            showStatus('<span class="spinner"></span>Setting up storage...', 'loading');
            
            try {
                const response = await fetch('/api/setup/confirm-storage-location', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        storage_dir: selectedStoragePath
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    showStatus('');
                    // Mark first-run as complete and proceed to API key setup
                    markFirstRunComplete();
                    // Proceed to next step (API key setup)
                    window.location.href = '/static/setup.html';
                } else {
                    showStatus(data.error || 'Failed to save storage configuration', 'error');
                    continueBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error confirming storage location:', error);
                showStatus('Error: ' + error.message, 'error');
                continueBtn.disabled = false;
            }
        }
        
        async function markFirstRunComplete() {
            try {
                await fetch('/api/setup/mark-first-run-complete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
            } catch (error) {
                console.warn('Failed to mark first-run complete:', error);
                // Continue anyway
            }
        }
        
        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('statusMessage');
            if (message) {
                statusDiv.innerHTML = message;
                statusDiv.className = 'status-message show status-' + type;
            } else {
                statusDiv.className = 'status-message';
            }
        }
        
        // Initialize on load
        window.addEventListener('load', initializeStorageSelection);
    </script>
</body>
</html>
