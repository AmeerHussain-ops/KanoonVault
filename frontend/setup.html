<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanoonVault - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
        }

        .setup-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #1e3c72;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2a5298;
        }

        .input-hint {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-test {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-test:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .btn-test:active {
            transform: scale(0.98);
        }

        .btn-test:disabled,
        .btn-test[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-continue {
            background: #2a5298;
            color: white;
            flex: 2;
        }

        .btn-continue:hover:not([disabled]) {
            background: #1e3c72;
        }

        .btn-continue:active:not([disabled]) {
            transform: scale(0.98);
        }

        .btn-continue[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-out;
            display: none;
            font-size: 13px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .status-message.show {
            display: block;
        }

        .status-success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .status-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .status-loading {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(21, 101, 192, 0.2);
            border-top-color: #1565c0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .help-text {
            background: #f5f5f5;
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .help-text a {
            color: #2a5298;
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        .key-input-group {
            position: relative;
        }

        .toggle-key {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 18px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .toggle-key:hover {
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="setup-card">
            <div class="logo">
                <h1>⚖️ KanoonVault</h1>
                <p>Set Up AI Assistance</p>
            </div>

            <form id="setupForm">
                <div class="form-group">
                    <label for="apiKey">OpenRouter API Key (Chat & Timeline)</label>
                    <div class="key-input-group">
                        <input type="password" id="apiKey" placeholder="sk-or-v1-••••••••••••••" required
                            autocomplete="off">
                        <button type="button" class="toggle-key" id="toggleKey" title="Show/hide key">👁️</button>
                    </div>
                    <span class="input-hint">Powers KanoonVault Chat & Legal Reasoning. Stored locally.</span>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="roboflowKey">Roboflow API Key (GLM-OCR Vision)</label>
                    <div class="key-input-group">
                        <input type="password" id="roboflowKey" placeholder="rf_•••••••••••••• or OpenRouter key"
                            autocomplete="off">
                        <button type="button" class="toggle-key" id="toggleRoboflowKey"
                            title="Show/hide key">👁️</button>
                    </div>
                    <span class="input-hint">Powers GLM-OCR Roboflow Workflow for document extraction.</span>
                </div>

                <div id="statusMessage" class="status-message"></div>

                <div class="button-group">
                    <button type="button" class="btn-test" id="testBtn" onclick="testConnection()">
                        Test Connection
                    </button>
                    <button type="button" class="btn-continue" id="continueBtn" disabled onclick="continueSetup()">
                        Continue
                    </button>
                </div>

                <div class="help-text">
                    <strong>Need API keys?</strong><br>
                    • OpenRouter Key: <a href="https://openrouter.ai" target="_blank">openrouter.ai</a><br>
                    • Roboflow Key: <a href="https://roboflow.com" target="_blank">roboflow.com</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const testBtn = document.getElementById('testBtn');
        const continueBtn = document.getElementById('continueBtn');
        const statusMessage = document.getElementById('statusMessage');
        const toggleKeyBtn = document.getElementById('toggleKey');

        const roboflowKeyInput = document.getElementById('roboflowKey');
        const toggleRoboflowKeyBtn = document.getElementById('toggleRoboflowKey');

        let testPassed = false;

        // Toggle API key visibility
        toggleKeyBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = apiKeyInput.type === 'password';
            apiKeyInput.type = isPassword ? 'text' : 'password';
            toggleKeyBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        if (toggleRoboflowKeyBtn) {
            toggleRoboflowKeyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const isPassword = roboflowKeyInput.type === 'password';
                roboflowKeyInput.type = isPassword ? 'text' : 'password';
                toggleRoboflowKeyBtn.textContent = isPassword ? '🙈' : '👁️';
            });
        }

        // Reset test status when user changes the input
        apiKeyInput.addEventListener('input', () => {
            testPassed = false;
            continueBtn.disabled = true;
            statusMessage.classList.remove('show');
        });

        async function testConnection() {
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                showStatus('❌ Please enter an API key', 'error');
                return;
            }

            testBtn.disabled = true;
            showStatus('<span class="spinner"></span>Testing connection...', 'loading');

            try {
                const response = await fetch('/api/setup/test-api-key?api_key=' + encodeURIComponent(apiKey), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.valid) {
                    showStatus(data.message, 'success');
                    testPassed = true;
                    continueBtn.disabled = false;
                } else {
                    showStatus(data.message, 'error');
                    testPassed = false;
                    continueBtn.disabled = true;
                }
            } catch (error) {
                showStatus('❌ Connection test failed: ' + error.message, 'error');
                testPassed = false;
                continueBtn.disabled = true;
            } finally {
                testBtn.disabled = false;
            }
        }

        async function continueSetup() {
            if (!testPassed) {
                showStatus('❌ Please test the connection first', 'error');
                return;
            }

            const apiKey = apiKeyInput.value.trim();
            const roboflowKey = roboflowKeyInput ? roboflowKeyInput.value.trim() : '';
            continueBtn.disabled = true;
            showStatus('<span class="spinner"></span>Saving API key(s)...', 'loading');

            try {
                const response = await fetch('/api/setup/save-api-key?api_key=' + encodeURIComponent(apiKey) + '&key_type=OPENROUTER', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (roboflowKey) {
                    await fetch('/api/setup/save-api-key?api_key=' + encodeURIComponent(roboflowKey) + '&key_type=ROBOFLOW', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                }

                if (data.ok) {
                    showStatus('✅ API key(s) saved!\nRedirecting to KanoonVault...', 'success');
                    // Redirect to main app
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showStatus('❌ Failed to save API key', 'error');
                    continueBtn.disabled = false;
                }
            } catch (error) {
                showStatus('❌ Failed to save: ' + error.message, 'error');
                continueBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            statusMessage.innerHTML = message;
            statusMessage.className = 'status-message show status-' + type;
        }

        // Allow Enter key to test
        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !testBtn.disabled) {
                testConnection();
            }
        });

        // Check setup status (redirect to welcome if first-run storage incomplete)
        async function checkSetupStatus() {
            try {
                const storageResponse = await fetch('/api/setup/storage-location');
                const storageData = await storageResponse.json();

                if (!storageData.first_run_complete) {
                    console.log('[Setup] Redirecting to welcome - first-run incomplete');
                    window.location.href = '/static/welcome.html';
                    return;
                }
            } catch (error) {
                console.error('Failed to check setup status:', error);
            }
        }

        // Check on load
        checkSetupStatus();

        // Focus on the API key input
        apiKeyInput.focus();
    </script>
</body>

</html>
